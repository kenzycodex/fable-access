# Runs on every push and pull request to main: API lint, tests and dependency
# audit; web types, lint, unit tests, dependency audit and production build;
# the browser tests; and a build of the API image. A push to main deploys the
# API only when all of them pass, through the "production" environment (add
# required reviewers to it in the repository settings to approve each deploy).
# The frontend deploys itself through Vercel.
#
# Actions are pinned to a commit, not a tag, so a moved tag cannot change what
# runs here. The tag each one was is in the comment.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push cancels an older pull request run, but never a run on main:
# that run may be part-way through a deploy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api:
    name: API lint, tests and audit
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.lock
      - run: pip install -r requirements-dev.lock
      - run: python -m ruff check .
      - run: python -m pytest tests -q
      - name: Known vulnerabilities in the API's dependencies
        run: |
          pip install pip-audit
          pip-audit -r requirements.lock --progress-spinner off

  web:
    name: Web types, lint, tests, audit and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit -p tsconfig.json
      - run: pnpm exec eslint .
      - run: pnpm test
      - name: Known vulnerabilities in production dependencies
        run: pnpm audit --prod --audit-level high
      - run: pnpm build

  e2e:
    name: Browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.lock
      - run: pip install -r api/requirements-dev.lock
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          FABLE_E2E_PYTHON: python
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  image:
    name: API image builds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: docker build -t fable-api:ci api
      - name: Runs as the unprivileged user
        run: test "$(docker run --rm --entrypoint id fable-api:ci -u)" = "10001"

  deploy:
    name: Deploy API
    needs: [api, web, e2e, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      # The key in DEPLOY_SSH_KEY can only run api/scripts/deploy_server.sh on
      # the server (a forced command), so this step sends no command of its own.
      # Until the secrets are set (docs/DEPLOYMENT.md), it skips quietly.
      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "::notice::Deploy secrets are not set, so the API was not deployed. See docs/DEPLOYMENT.md."
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -T -i ~/.ssh/deploy -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "${DEPLOY_USER:-root}@${DEPLOY_HOST}"

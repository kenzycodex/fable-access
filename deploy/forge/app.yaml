# Fable on the Access Youth Tech Forge cluster, namespace team11.
#
# Two workloads:
#   app  the website. This is the one Service the platform publishes, so it
#        must be named `app` and listen on port 80. TLS ends upstream.
#   api  the Fable API. Internal only: the site forwards /fable-api to it, and
#        the bank's webhooks reach it by name inside the namespace.
#
#   kubectl apply -f deploy/forge/app.yaml
#   kubectl set image deployment/api api=ghcr.io/kenzycodex/fable-access-api:<tag>
#   kubectl set image deployment/app app=ghcr.io/kenzycodex/fable-access-web:<tag>
#
# Secrets are never written here. The team key comes from the `huawei-gateway`
# secret the platform provisioned (as GATEWAY_KEY); Fable's own settings come
# from a `fable-env` secret created once (docs/DEPLOY-FORGE.md).
# Quota check: requests 200m / 512Mi of 400m / 768Mi, limits 1 core / 1Gi of
# 2 cores / 2Gi, 2 pods of 10, 2 Services of 5, no persistent volume.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  # One pod at a time: the database is a single SQLite file, so the old pod
  # must stop before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      imagePullSecrets:
        - name: regcred
      # The image runs as uid 10001; fsGroup makes the volume writable by it.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: ghcr.io/kenzycodex/fable-access-api:REPLACE_WITH_TAG
          ports:
            - containerPort: 8010
          env:
            - { name: PORT, value: "8010" }
            - { name: ENVIRONMENT, value: production }
            - { name: FABLE_DB_PATH, value: /data/fable.db }
            - { name: FORGE_BANK_BASE_URL, value: "http://bank-api.ingress-apisix.svc.cluster.local/v1" }
            - { name: FORGE_MAAS_BASE_URL, value: "http://huawei-maas.ingress-apisix.svc.cluster.local/openai/v1" }
          envFrom:
            - secretRef: { name: huawei-gateway, optional: true }
            - secretRef: { name: fable-env, optional: true }
          volumeMounts:
            - { name: data, mountPath: /data }
          readinessProbe:
            httpGet: { path: /healthz, port: 8010 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8010 }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        # Temporary storage, on purpose. The cluster's block storage could not be
        # created (the provider refused: "outstanding balance on your account"),
        # so the database lives only as long as this pod does. After a restart
        # the data is gone: run scripts/forge_seed.py again (docs/DEPLOY-FORGE.md).
        # With working storage, swap this for a PersistentVolumeClaim of 10Gi
        # (the provider's smallest volume) mounted at /data.
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: { app: api }
  ports:
    - port: 80
      targetPort: 8010
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  replicas: 1
  selector:
    matchLabels: { app: app }
  template:
    metadata:
      labels: { app: app }
    spec:
      imagePullSecrets:
        - name: regcred
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: app
          image: ghcr.io/kenzycodex/fable-access-web:REPLACE_WITH_TAG
          ports:
            - containerPort: 8080
          env:
            # The demo page's key for the API, from the `forge-demo` secret
            # created after the seed script runs (docs/DEPLOY-FORGE.md). The
            # server uses it; the browser never sees it.
            - name: FORGE_DEMO_API_KEY
              valueFrom:
                secretKeyRef: { name: forge-demo, key: api-key, optional: true }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: app
spec:
  selector: { app: app }
  ports:
    - port: 80
      targetPort: 8080

# Ruff settings for the API. Kept out of pyproject.toml on purpose: Vercel
# treats any pyproject.toml in the repository as a Python project to build.
target-version = "py312"
line-length = 120
extend-exclude = [".venv"]

[lint]
# Import order only for now; the codebase predates a linter.
select = ["I"]

[lint.isort]
known-first-party = ["agents", "core", "intelligence", "middleware", "models", "routers", "services"]

# Tool settings for the API. Dependencies stay in requirements*.txt, which the
# Dockerfile and CI install from.

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [".venv"]

[tool.ruff.lint]
# Import order only for now; the codebase predates a linter.
select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["agents", "core", "intelligence", "middleware", "models", "routers", "services"]

[tool.pytest.ini_options]
testpaths = ["tests"]
